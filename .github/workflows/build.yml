name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job, which runs on tags alone, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      # Actions are pinned by commit, not by tag: a tag can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Collect and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/Release/wc2r-plus-setup-*.exe, build/bin/Release/version.dll, THIRD_PARTY_NOTICES.txt dist/
          $lines = foreach ($f in Get-ChildItem dist/* -Include *.exe, *.dll) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wc2r-plus
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: wc2r-plus
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
